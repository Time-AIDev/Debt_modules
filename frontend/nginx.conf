map $uri $volt_cache_policy {
  ~^/assets/ "public, max-age=31536000, immutable";
  default "no-store";
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # SPA deep links must return 200, not 404 — the reason nginx was chosen over GCS.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
  location = /livez {
    access_log off;
    return 200 "ok\n";
  }

  location /assets/ {
    try_files $uri =404;
  }

  # config.json is per-environment and must never be cached.
  location = /config.json {
    try_files $uri =404;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Cache-Control $volt_cache_policy always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://accounts.google.com/gsi/ https://identitytoolkit.googleapis.com; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
}
