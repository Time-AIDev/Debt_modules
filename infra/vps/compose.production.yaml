# volt-debt-platform — PRODUCTION stack
# Project: volt-debt-prd
# Domain: collection.volt.co.th
#
# Usage:
#   docker compose -f infra/vps/compose.production.yaml --env-file .env.production up -d
#
name: volt-debt-prd

services:
  db-prd:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: debt
      POSTGRES_USER: debt_migrate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing database password}
    volumes:
      - postgres-prd:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U debt_migrate -d debt"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  migrate-prd:
    profiles: [setup]
    image: ${API_IMAGE:?Missing API image}
    command: [python, -m, app.migrate]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Missing migration URL}
      DB_RUNTIME_ROLE: debt_api
    depends_on:
      db-prd: {condition: service_healthy}
    logging: *logging

  api-prd:
    profiles: [production]
    image: ${API_IMAGE:?Missing API image}
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    env_file: [/etc/volt-debt/production/api.env]
    volumes: ["/srv/volt-debt-data-production/objects:/private-objects"]
    ports: ["127.0.0.1:8082:8080"]
    depends_on:
      db-prd: {condition: service_healthy}
      scanner-prd: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    logging: *logging

  worker-prd:
    profiles: [production]
    image: ${API_IMAGE:?Missing API image}
    command: [python, -m, app.local_worker]
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    env_file: [/etc/volt-debt/production/api.env]
    volumes: ["/srv/volt-debt-data-production/objects:/private-objects"]
    depends_on:
      db-prd: {condition: service_healthy}
      scanner-prd: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, app.local_worker, --healthcheck]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 1500m
    logging: *logging

  scanner-prd:
    image: ${SCANNER_IMAGE:?Missing scanner image}
    restart: unless-stopped
    volumes: ["clamav-prd:/var/lib/clamav"]
    mem_limit: 2g
    logging: *logging

  web-prd:
    profiles: [production]
    image: ${WEB_IMAGE:?Missing web image}
    restart: unless-stopped
    environment:
      ENV: prd
      API_BASE_URL: /api
    ports: ["127.0.0.1:8083:8080"]
    healthcheck:
      test: [CMD, wget, -q, -T, "3", -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    logging: *logging

volumes:
  postgres-prd:
  clamav-prd:
