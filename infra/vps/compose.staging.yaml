# volt-debt-platform — STAGING stack
# Project: volt-debt-stg
# Domain: debt.volt.co.th
#
# Usage:
#   docker compose -f infra/vps/compose.staging.yaml --env-file .env.staging up -d
#
name: volt-debt-stg

services:
  db-stg:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: debt
      POSTGRES_USER: debt_migrate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing database password}
    volumes:
      - postgres-stg:/var/lib/postgresql/data
      - /etc/volt-debt/staging/init-runtime.sql:/docker-entrypoint-initdb.d/10-runtime.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U debt_migrate -d debt"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  migrate-stg:
    profiles: [setup]
    image: ${API_IMAGE:?Missing API image}
    command: [python, -m, app.migrate]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Missing migration URL}
      DB_RUNTIME_ROLE: debt_api
    depends_on:
      db-stg: {condition: service_healthy}
    logging: *logging

  api-stg:
    profiles: [staging]
    image: ${API_IMAGE:?Missing API image}
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    env_file: [/etc/volt-debt/staging/api.env]
    volumes: ["/srv/volt-debt-data-staging/objects:/private-objects"]
    ports: ["127.0.0.1:8091:8080"]
    networks: [default, volt-edge-net]
    depends_on:
      db-stg: {condition: service_healthy}
      scanner-stg: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    logging: *logging

  worker-stg:
    profiles: [staging]
    image: ${API_IMAGE:?Missing API image}
    command: [python, -m, app.local_worker]
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    env_file: [/etc/volt-debt/staging/api.env]
    volumes: ["/srv/volt-debt-data-staging/objects:/private-objects"]
    depends_on:
      db-stg: {condition: service_healthy}
      scanner-stg: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, app.local_worker, --healthcheck]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 1000m
    logging: *logging

  scanner-stg:
    image: ${SCANNER_IMAGE:?Missing scanner image}
    restart: unless-stopped
    volumes: ["clamav-stg:/var/lib/clamav"]
    mem_limit: 1500m
    logging: *logging

  web-stg:
    profiles: [staging]
    image: ${WEB_IMAGE:?Missing web image}
    restart: unless-stopped
    environment:
      ENV: stg
      API_BASE_URL: /api
    ports: ["127.0.0.1:8090:8080"]
    networks: [default, volt-edge-net]
    healthcheck:
      test: [CMD, wget, -q, -T, "3", -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    logging: *logging

volumes:
  postgres-stg:
  clamav-stg:

networks:
  # Shared with the existing edge (volt-debt-edge-1) so Caddy can resolve
  # api-stg/web-stg by name. Attached live via `docker network connect` and
  # persisted for the edge in /etc/volt-debt/compose.edge.override.yaml.
  volt-edge-net:
    external: true
