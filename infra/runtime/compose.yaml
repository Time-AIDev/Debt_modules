name: ${RUNTIME_PROJECT:?Missing isolated runtime project}
services:
  db:
    image: ${POSTGRES_IMAGE:?Missing PostgreSQL image}
    restart: unless-stopped
    environment:
      POSTGRES_DB: debt
      POSTGRES_USER: debt_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing local database credential}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U debt_local -d debt"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  objects-init:
    image: ${API_IMAGE:?Missing tested API image}
    user: "0:0"
    network_mode: none
    command: [python, -c, "import os; os.chown('/private-objects',10001,10001); os.chmod('/private-objects',0o700)"]
    volumes: ["objects:/private-objects"]
    restart: "no"
  migrate:
    profiles: [setup]
    image: ${API_IMAGE:?Missing tested API image}
    command: [python, -m, app.migrate]
    env_file: ["${RUNTIME_API_ENV:?Missing private runtime settings}"]
    depends_on:
      db: {condition: service_healthy}
  api:
    image: ${API_IMAGE:?Missing tested API image}
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    env_file: ["${RUNTIME_API_ENV:?Missing private runtime settings}"]
    ports: ["127.0.0.1:${RUNTIME_API_PORT:?Missing API port}:8080"]
    volumes: ["objects:/private-objects"]
    depends_on:
      db: {condition: service_healthy}
      scanner: {condition: service_healthy}
      objects-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz',timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1g
  worker:
    image: ${API_IMAGE:?Missing tested API image}
    command: [python, -m, app.local_worker]
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    env_file: ["${RUNTIME_API_ENV:?Missing private runtime settings}"]
    volumes: ["objects:/private-objects"]
    depends_on:
      db: {condition: service_healthy}
      scanner: {condition: service_healthy}
      objects-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, app.local_worker, --healthcheck]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1800m
  scanner:
    image: ${SCANNER_IMAGE:?Missing tested scanner image}
    restart: unless-stopped
    volumes: ["clamav:/var/lib/clamav"]
    mem_limit: 3g
  web:
    image: ${WEB_IMAGE:?Missing tested web image}
    restart: unless-stopped
    environment: {ENV: "${RUNTIME_ENVIRONMENT}", API_BASE_URL: /api}
    ports: ["127.0.0.1:${RUNTIME_WEB_PORT:?Missing web port}:8080"]
    volumes: ["${RUNTIME_NGINX_CONFIG:?Missing runtime API proxy}:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -T, "3", -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 128m
volumes:
  postgres:
  objects:
  clamav:
