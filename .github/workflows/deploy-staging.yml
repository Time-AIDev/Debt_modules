# Staging: PR merged into `staging` branch → build images → push to GHCR → SSH deploy to VPS.
#
# Required GitHub secrets:
#   STAGING_HOST      — VPS IP or hostname (e.g. 143.198.207.143)
#   STAGING_SSH_KEY   — Private SSH key (ed25519, no passphrase, user must have root or docker group)
#
# Optional secrets (defaults shown):
#   GHCR_OWNER        — defaults to github.repository_owner

name: Deploy Staging

on:
  pull_request:
    types: [closed]
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false   # Never cancel a half-finished deploy

jobs:
  test:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Run backend tests
        run: |
          cd backend
          pip install -r requirements.txt
          pytest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend tests
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm test

  build:
    needs: test
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: infra/production/Dockerfile.api
            tag: volt-debt-api
          - name: web
            context: frontend
            file: frontend/Dockerfile
            tag: volt-debt-web
          - name: scanner
            context: .
            file: infra/vps/Dockerfile.scanner
            tag: volt-debt-scanner
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.tag }}:staging
            ghcr.io/${{ github.repository_owner }}/${{ matrix.tag }}:${{ github.sha }}
          build-args: |
            VOLT_GIT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: root
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail

            REPO_DIR=/srv/volt-debt-platform
            OWNER="${{ github.repository_owner }}"
            SHA="${{ github.sha }}"

            # 1. Update source
            cd "$REPO_DIR"
            git fetch origin staging
            git reset --hard "$SHA"

            # 2. Point .env.staging at the new image tags
            sed -i \
              -e "s|^API_IMAGE=.*|API_IMAGE=ghcr.io/${OWNER}/volt-debt-api:${SHA}|" \
              -e "s|^WEB_IMAGE=.*|WEB_IMAGE=ghcr.io/${OWNER}/volt-debt-web:${SHA}|" \
              -e "s|^SCANNER_IMAGE=.*|SCANNER_IMAGE=ghcr.io/${OWNER}/volt-debt-scanner:staging|" \
              "$REPO_DIR/.env.staging"

            # 3. Pull & restart staging stack
            docker compose -f "$REPO_DIR/infra/vps/compose.staging.yaml" --env-file "$REPO_DIR/.env.staging" pull
            docker compose -f "$REPO_DIR/infra/vps/compose.staging.yaml" --env-file "$REPO_DIR/.env.staging" --profile staging up -d --remove-orphans

            # 4. Prune old images (keep last 2)
            docker image prune -af --filter "until=48h"

            echo "✅ Staging deployed — commit $SHA"
